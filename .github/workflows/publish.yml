name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build package
        run: uv build

      - name: Check package
        run: uvx twine check dist/*

      - name: Smoke test (run wheel via uv, stdio ping replies ok)
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"ping"}\n' | \
            uv tool run --from dist/*.whl pentool-mcp-server | \
            grep -q '"status":"ok"'

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN_FULL }}
        run: uv publish --publish-url https://upload.pypi.org/legacy/
