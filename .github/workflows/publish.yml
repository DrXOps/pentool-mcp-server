name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build package
        run: uv build

      - name: Check package
        run: uvx twine check dist/*

      - name: Smoke test (install wheel via uv, protocol dispatch works)
        run: |
          uv tool run --from dist/*.whl python -c '
            from pentool_mcp_server.__main__ import _handle_request
            p = _handle_request({"jsonrpc":"2.0","id":1,"method":"ping"})
            assert p["result"]["status"] == "ok", p
            t = _handle_request({"jsonrpc":"2.0","id":2,"method":"tools/list"})
            assert len(t["result"]["tools"]) >= 3, t
            print("smoke ok")
          '

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN_FULL }}
        run: uv publish --publish-url https://upload.pypi.org/legacy/
