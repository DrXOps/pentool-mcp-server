name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # Trusted publishing (OIDC) — grants PyPI a short-lived token with no
  # secret required. Configure once on PyPI: "Add publisher" for this repo
  # (github.com/DrXOps/pentool-mcp-server) on the `main` branch.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build package
        run: uv build

      - name: Check package
        run: uvx twine check dist/*

      - name: Smoke test (install wheel in clean venv, stdio ping replies ok)
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --quiet dist/*.whl
          printf '{"jsonrpc":"2.0","id":1,"method":"ping"}\n' | \
            /tmp/smoke-venv/bin/pentool-mcp-server | grep -q '"status":"ok"'

      # Publish with trusted publishing when available, else fall back to the
      # classic token in secrets.
      - name: Publish to PyPI (trusted publishing)
        id: publish_oidc
        if: github.event_name == 'push'
        run: uv publish --publish-url https://upload.pypi.org/legacy/
        continue-on-error: true

      - name: Publish to PyPI (token fallback)
        if: steps.publish_oidc.outcome == 'failure'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: uvx twine upload dist/*
