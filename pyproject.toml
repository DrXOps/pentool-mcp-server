[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pentool-mcp-server"
version = "0.2.0"
description = "MCP (stdio JSON-RPC) server for Pentool AI — local LLM assistant for pentest"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.10"
keywords = [
    "mcp", "model-context-protocol", "json-rpc", "llm", "ai", "penetration-testing",
    "security", "pentool", "pentest", "local-llm", "stdio-server",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

dependencies = [
    # Намеренно минимальные — сервер должен работать без тяжёлой LLM-рамки.
    # Реальная генерация (llama-cpp) подключается опционально, чтобы health
    # и stdio-протокол работали сразу после установки.
]

[project.optional-dependencies]
llm = [
    # Движок генерации. Тяжёлая зависимость, подключается отдельно:
    #   uv tool install pentool-mcp-server --with "pentool-mcp-server[llm]"
    "llama-cpp-python>=0.3.0",
]

[project.scripts]
pentool-mcp-server = "pentool_mcp_server.__main__:main"

[project.urls]
Homepage = "https://github.com/DrXOps/pentool-mcp-server"
Repository = "https://github.com/DrXOps/pentool-mcp-server"
Issues = "https://github.com/DrXOps/pentool-mcp-server/issues"
# Главное приложение, для которого создан этот сервер — ведёт на основной репо.
Pentool = "https://github.com/DrXOps/pentool"
Documentation = "https://github.com/DrXOps/pentool-mcp-server/blob/main/docs/GUIDE.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["pentool_mcp_server*"]
